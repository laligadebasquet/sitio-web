<style>
  :root{
    --navy:#000000;
    --navy-2:#141414;
    --orange:#F37228;
    --orange-dark:#E3621D;
    --gray-bg:#F5F5F5;
    --gray-line:#E2E2E2;
    --text:#111111;
    --text-soft:#6B6B6B;
    --win:#1E8E3E;
    --loss:#D93025;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Montserrat','Segoe UI',Arial,Helvetica,sans-serif;
    background:var(--gray-bg);
    color:var(--text);
  }
  a{color:var(--orange);}
  h1,h2,h3{margin:0;}
  header.topbar{
    background:#000;
    color:#fff;
    padding:18px 24px;
    border-bottom:4px solid var(--orange);
  }
  .topbar-inner{
    max-width:820px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{height:44px;width:44px;display:block;flex-shrink:0;}
  .brand-text{display:flex;flex-direction:column;line-height:1;}
  .brand-nombre{font-weight:900;font-size:16px;color:#fff;text-transform:uppercase;letter-spacing:-.2px;}
  .brand-sub{font-weight:700;font-size:10px;color:var(--orange);text-transform:uppercase;letter-spacing:1.2px;margin-top:5px;}
  .volver-link{
    color:#B5B5B5;
    font-size:11px;
    font-weight:700;
    text-decoration:none;
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .volver-link:hover{color:#fff;}
  .equipo-pill{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;
    padding:8px 16px;
    text-align:right;
  }
  .equipo-pill .nombre{font-size:13px;font-weight:800;color:#fff;text-transform:uppercase;}
  .equipo-pill .cat{font-size:10px;color:var(--orange);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .cerrar-sesion-btn{
    background:transparent;
    border:1px solid rgba(255,255,255,.3);
    color:#fff;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.4px;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
  }
  .cerrar-sesion-btn:hover{background:rgba(255,255,255,.1);}
  nav.tabs{
    max-width:820px;
    margin:16px auto 0 auto;
    display:flex;
    gap:4px;
    border-bottom:1px solid rgba(255,255,255,.12);
    overflow-x:auto;
  }
  nav.tabs button{
    background:none;
    border:none;
    color:#B5B5B5;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.4px;
    padding:12px 16px;
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button:hover{color:#fff;}
  nav.tabs button.active{color:var(--orange);border-bottom-color:var(--orange);}
  main{max-width:820px;margin:24px auto 60px auto;padding:0 24px;}
  section.view{display:none;}
  section.view.active{display:block;}
  .section-heading{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:18px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.3px;
    margin:0 0 20px 0;
  }
  .section-heading .line{flex:1;height:1px;background:var(--gray-line);}
  .card{
    background:#fff;
    border:1px solid var(--gray-line);
    border-radius:10px;
    padding:20px;
    margin-bottom:16px;
  }
  .empty-state{
    color:var(--text-soft);
    font-size:14px;
    padding:24px;
    text-align:center;
    background:#fff;
    border:1px solid var(--gray-line);
    border-radius:10px;
  }
  /* ---- Roster ---- */
  .roster-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 4px;
    border-bottom:1px solid var(--gray-line);
    font-size:14px;
  }
  .roster-item:last-child{border-bottom:none;}
  .roster-item .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;height:26px;
    background:var(--navy);
    color:#fff;
    border-radius:50%;
    font-size:11px;
    font-weight:800;
    margin-right:12px;
  }
  .roster-nombre{display:flex;align-items:center;font-weight:700;}
  .roster-correo{color:var(--text-soft);font-size:12px;}
  /* ---- Pagos ---- */
  .pago-resumen{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
  }
  .pago-resumen div{
    background:var(--gray-bg);
    border:1px solid var(--gray-line);
    border-radius:8px;
    padding:12px;
    text-align:center;
  }
  .pago-label{font-size:9px;color:var(--text-soft);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .pago-valor{font-size:16px;font-weight:800;color:var(--text);margin-top:4px;}
  .pago-valor.saldo-pendiente{color:var(--loss);}
  .pago-valor.saldo-pagado{color:var(--win);}
  @media (max-width:600px){.pago-resumen{grid-template-columns:1fr 1fr;}}
  .pago-historial-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 4px;
    border-bottom:1px solid var(--gray-line);
    font-size:13px;
  }
  .pago-historial-item:last-child{border-bottom:none;}
  .pago-historial-monto{font-weight:800;color:var(--win);}
  .pago-historial-meta{color:var(--text-soft);font-size:11px;margin-top:2px;}
  /* ---- Contacto ---- */
  .contacto-card{
    background:#000;
    color:#fff;
    border-radius:14px;
    padding:24px;
    text-align:center;
  }
  .contacto-card p{font-size:13px;color:#B5B5B5;margin:0 0 18px 0;}
  .whatsapp-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#25D366;
    color:#fff;
    font-weight:800;
    font-size:14px;
    text-decoration:none;
    padding:14px 26px;
    border-radius:10px;
  }
  .contacto-horario{font-size:12px;color:var(--text-soft);margin-top:16px;}
  /* ---- Login ---- */
  .lock-overlay{
    position:fixed; inset:0; background:var(--navy);
    display:flex; align-items:center; justify-content:center; z-index:200;
    padding:20px;
  }
  .lock-box{
    background:#fff; border-radius:14px; padding:32px;
    max-width:340px; width:100%; text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
  }
  .lock-box .brand-logo{height:56px;width:56px;margin:0 auto 14px auto;}
  .lock-box h2{margin:0 0 6px 0;font-size:18px;font-weight:900;text-transform:uppercase;}
  .lock-box p{margin:0 0 22px 0;font-size:12px;color:var(--text-soft);}
  .lock-box label{display:block;text-align:left;font-size:11px;font-weight:700;color:var(--text-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
  .lock-box input{
    width:100%;padding:11px 12px;border:1px solid var(--gray-line);border-radius:8px;
    font-size:14px;margin-bottom:14px;font-family:inherit;
  }
  .lock-box input:focus{outline:none;border-color:var(--orange);}
  .lock-box button{
    width:100%;background:var(--orange);color:#fff;border:none;border-radius:8px;
    padding:13px;font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;
  }
  .lock-box button:hover{background:var(--orange-dark);}
  .lock-error{color:var(--loss);font-size:12px;margin-top:12px;display:none;}
  .lock-volver{display:block;margin-top:18px;font-size:12px;color:var(--text-soft);text-decoration:none;}
  .lock-volver:hover{color:var(--text);}
  /* ---- Cambiar contraseña ---- */
  .form-campo{margin-bottom:14px;text-align:left;}
  .form-campo label{display:block;font-size:11px;font-weight:700;color:var(--text-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
  .form-campo input{
    width:100%;padding:11px 12px;border:1px solid var(--gray-line);border-radius:8px;
    font-size:14px;font-family:inherit;
  }
  .form-campo input:focus{outline:none;border-color:var(--orange);}
  .save-btn{
    background:var(--orange);color:#fff;border:none;border-radius:8px;
    padding:13px 22px;font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;
  }
  .save-btn:hover{background:var(--orange-dark);}
  .save-btn:disabled{background:#C9C9C9;cursor:not-allowed;}
  .msg{padding:11px 12px;border-radius:8px;font-size:13px;margin-top:14px;display:none;font-weight:600;}
  .msg.ok{background:rgba(30,142,62,.1);color:var(--win);display:block;border:1px solid var(--win);}
  .msg.err{background:rgba(217,48,37,.1);color:var(--loss);display:block;border:1px solid var(--loss);}
</style>
</head>

<script>
/* ============================================================
   CONFIGURACIÓN
   appsScriptUrl: la misma "URL de la aplicación web" que usan la Consola
   y el Admin (Web App de AppsScript_Liga.gs, acción "loginCapitan" /
   "cambiarPasswordCapitan").
   ============================================================ */
const CONFIG = {
  appsScriptUrl: "https://script.google.com/macros/s/AKfycbyli-ZsXTYA6felhpvlBX7CFOrPaW-_DieSupKALbAulsdAMM4ajBU_jea_okdZcQNL/exec"
};

/* Envía al Web App. Mismo patrón que usan la Consola y el Admin
   (text/plain para evitar el preflight de CORS que Apps Script no maneja). */
async function enviarAlSheet(payload){
  if(!CONFIG.appsScriptUrl) throw new Error("Falta configurar CONFIG.appsScriptUrl.");
  const res = await fetch(CONFIG.appsScriptUrl, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "Error desconocido");
  return data;
}

/* ---- Sesión (se guarda en sessionStorage: dura mientras la pestaña esté
   abierta, y se vuelve a pedir la próxima vez que abran el navegador). ---- */
function guardarCredenciales(correo, password){
  sessionStorage.setItem("capitanCorreo", correo);
  sessionStorage.setItem("capitanPassword", password);
}
function leerCredenciales(){
  const correo = sessionStorage.getItem("capitanCorreo");
  const password = sessionStorage.getItem("capitanPassword");
  return (correo && password) ? {correo, password} : null;
}
function borrarCredenciales(){
  sessionStorage.removeItem("capitanCorreo");
  sessionStorage.removeItem("capitanPassword");
}

let SESION = null; // {equipo, categoria, codigo, roster, pagos}

async function intentarLogin(){
  const correo = document.getElementById("loginCorreo").value.trim();
  const password = document.getElementById("loginPassword").value.trim();
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("loginError");
  err.style.display = "none";
  if(!correo || !password){
    err.textContent = "Escribe tu correo y tu contraseña.";
    err.style.display = "block";
    return;
  }
  btn.disabled = true;
  btn.textContent = "Entrando...";
  try{
    const data = await enviarAlSheet({ action: "loginCapitan", correo, password });
    SESION = { equipo: data.equipo, categoria: data.categoria, codigo: data.codigo, roster: data.roster, pagos: data.pagos };
    guardarCredenciales(correo, password);
    mostrarPortal();
  }catch(e){
    err.textContent = "Correo o contraseña incorrectos.";
    err.style.display = "block";
  }finally{
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
}
document.getElementById("loginPassword").addEventListener("keydown", (e)=>{
  if(e.key === "Enter") intentarLogin();
});

function cerrarSesion(){
  borrarCredenciales();
  SESION = null;
  document.getElementById("portal").style.display = "none";
  document.getElementById("lockOverlay").style.display = "flex";
  document.getElementById("loginPassword").value = "";
}

function mostrarPortal(){
  document.getElementById("lockOverlay").style.display = "none";
  document.getElementById("portal").style.display = "block";
  document.getElementById("pillEquipo").textContent = SESION.equipo;
  document.getElementById("pillCategoria").textContent = SESION.categoria;
  renderRoster();
  renderEstadisticas();
  renderPagos();
  renderSanciones();
  renderContacto();
  renderCuenta();
}

/* Al cargar la página, si ya había una sesión guardada en este navegador,
   se vuelve a mandar el login para traer los datos frescos (roster/pagos
   pueden haber cambiado) sin que el capitán tenga que volver a teclear. */
(async function initSesion(){
  const cred = leerCredenciales();
  if(!cred) return;
  try{
    const data = await enviarAlSheet({ action: "loginCapitan", correo: cred.correo, password: cred.password });
    SESION = { equipo: data.equipo, categoria: data.categoria, codigo: data.codigo, roster: data.roster, pagos: data.pagos };
    mostrarPortal();
  }catch(e){
    borrarCredenciales(); // la contraseña ya no sirve (se cambió en otro lado, etc.)
  }
})();

/* ---- Navegación entre pestañas ---- */
const VIEW_ID_BY_TAB = { roster: "view-roster", estadisticas: "view-estadisticas", pagos: "view-pagos", sanciones: "view-sanciones", contacto: "view-contacto", cuenta: "view-cuenta" };
document.querySelectorAll("nav.tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll("section.view").forEach(s=>s.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(VIEW_ID_BY_TAB[btn.dataset.view]).classList.add("active");
  });
});

/* ---- Roster ---- */
function renderRoster(){
  const el = document.getElementById("view-roster");
  const roster = (SESION && SESION.roster) || [];
  el.innerHTML = `
    <div class="section-heading">Roster<span class="line"></span></div>
    ${roster.length === 0
      ? '<div class="empty-state">Todavía no hay jugadores dados de alta en tu equipo.</div>'
      : '<div class="card">' + roster.map((j, i) => `
          <div class="roster-item">
            <span class="roster-nombre"><span class="num">${i+1}</span>${j.nombre}</span>
            <span class="roster-correo">${j.correo || ""}</span>
          </div>
        `).join("") + '</div>'
    }
  `;
}

/* ---- Estadísticas (bloqueado hasta el primer partido del equipo) ---- */
function renderEstadisticas(){
  const el = document.getElementById("view-estadisticas");
  el.innerHTML = `
    <div class="section-heading">Estadísticas del Equipo<span class="line"></span></div>

/* ---- Mi Cuenta: cambiar contraseña ---- */
function renderCuenta(){
  const el = document.getElementById("view-cuenta");
  el.innerHTML = `
    <div class="section-heading">Mi Cuenta<span class="line"></span></div>
    <div class="card">
      <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-soft);margin:0 0 16px 0;">Cambiar contraseña</h3>
      <div class="form-campo">
        <label for="cPassActual">Contraseña actual</label>
        <input type="password" id="cPassActual" autocomplete="current-password">
      </div>
      <div class="form-campo">
        <label for="cPassNueva">Contraseña nueva</label>
        <input type="password" id="cPassNueva" autocomplete="new-password" minlength="4">
      </div>
      <div class="form-campo">
        <label for="cPassConfirma">Confirma la contraseña nueva</label>
        <input type="password" id="cPassConfirma" autocomplete="new-password" minlength="4">
      </div>
      <button class="save-btn" id="btnCambiarPass" onclick="cambiarPassword()">Guardar contraseña</button>
      <div class="msg" id="msgCambiarPass"></div>
    </div>
  `;
}

async function cambiarPassword(){
  const passwordActual = document.getElementById("cPassActual").value.trim();
  const passwordNueva = document.getElementById("cPassNueva").value.trim();
  const passwordConfirma = document.getElementById("cPassConfirma").value.trim();
  const btn = document.getElementById("btnCambiarPass");
  const msg = document.getElementById("msgCambiarPass");
  msg.className = "msg";

  if(!passwordActual || !passwordNueva || !passwordConfirma){
    msg.className = "msg err"; msg.textContent = "Llena los tres campos."; return;
  }
  if(passwordNueva.length < 4){
    msg.className = "msg err"; msg.textContent = "La contraseña nueva debe tener al menos 4 caracteres."; return;
  }
  if(passwordNueva !== passwordConfirma){
    msg.className = "msg err"; msg.textContent = "La confirmación no coincide con la contraseña nueva."; return;
  }

  const cred = leerCredenciales();
  btn.disabled = true;
  btn.textContent = "Guardando...";
  try{
    await enviarAlSheet({ action: "cambiarPasswordCapitan", correo: cred.correo, passwordActual, passwordNueva });
    guardarCredenciales(cred.correo, passwordNueva);
    msg.className = "msg ok";
    msg.textContent = "Contraseña actualizada.";
    document.getElementById("cPassActual").value = "";
    document.getElementById("cPassNueva").value = "";
    document.getElementById("cPassConfirma").value = "";
  }catch(e){
    msg.className = "msg err";
    msg.textContent = "No se pudo cambiar la contraseña. Verifica que tu contraseña actual sea correcta.";
  }finally{
    btn.disabled = false;
    btn.textContent = "Guardar contraseña";
  }
}
</script>
